quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${AUTH_CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.jackson.fail-on-unknown-properties=false
auth.token.secret=${AUTH_TOKEN_SECRET:}
%test.auth.token.secret=test-only-secret-for-auth-token-signing-32-bytes
%test.quarkus.http.cors.origins=http://localhost:4200
